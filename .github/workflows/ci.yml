name: CI

on:
  push:
    branches: [develop, main, hotfix/temporary-npm-audit]
    tags:
      - "v*"
      - "dev-v*"
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One-off remote rebuild of the unchanged v2.2.2 release source.
env:
  TEMPORARY_RELEASE_SHA: 421e767cc8775ed438cdc9d417bf2e5152bebb2c

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/hotfix/temporary-npm-audit' && env.TEMPORARY_RELEASE_SHA || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release version
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/hotfix/temporary-npm-audit'
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" = 'refs/heads/hotfix/temporary-npm-audit' ]; then
            TAG_VERSION=2.2.2
          else
            TAG_VERSION="${GITHUB_REF_NAME#dev-v}"
            TAG_VERSION="${TAG_VERSION#v}"
          fi

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      # Temporary release exception while BankofAI SDKs still require Zod 3.
      # Restore blocking behavior after compatible patched SDKs are available.
      - name: Audit production dependencies (temporarily non-blocking)
        continue-on-error: true
        run: >-
          npm audit --omit=dev --audit-level=high
          --fetch-timeout=30000 --fetch-retries=2
          --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && ((github.ref_type == 'tag' && (startsWith(github.ref_name, 'dev-v') || startsWith(github.ref_name, 'v'))) || github.ref == 'refs/heads/hotfix/temporary-npm-audit')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.ref == 'refs/heads/hotfix/temporary-npm-audit' && 'v2.2.2' || startsWith(github.ref_name, 'dev-v') && 'dev' || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/hotfix/temporary-npm-audit' && env.TEMPORARY_RELEASE_SHA || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bankofai/x402-tron-facilitator
          labels: |
            org.opencontainers.image.revision=${{ github.ref == 'refs/heads/hotfix/temporary-npm-audit' && env.TEMPORARY_RELEASE_SHA || github.sha }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
