# Local runtime config for the production environment.
# Start with:
#   FACILITATOR_SERVICE_ENV=prod npm start
# Production configuration: verify runtime secrets, wallets and resources before release.
# Database endpoint and secret references below are retained from the old prod
# config; verify they still match the production deployment before release.
# Provision Agent Wallet on the host and mount it read-only via AGENT_WALLET_DIR.
# Incomplete database/Owner/resource settings intentionally fail startup validation.

database:
  # Credentials are injected from onepassword below before connecting.
  # Production PG URL, without credentials. Do not use the TN database.
  url: "postgresql://sunpump-sunagent-postsql-v2.c9w4kaa66fyg.us-east-1.rds.amazonaws.com:5432/x402_facilitator_prod"
  ssl_mode: "require"
  max_open_conns: 100

onepassword:
  # Retains production Service Account mode; inject OP_SERVICE_ACCOUNT_TOKEN.
  # Fill references as vault/item/field, not secret values.
  mode: service_account
  # Production database credential references restored from Git history.
  database_user: "x402-facilitator/psql/user"
  database_password: "x402-facilitator/psql/password"
  trongrid_api_key: "x402-facilitator/trongrid/trongrid_api_key"
  gasfree_api_key_nile: "x402-facilitator/gasfree/gasfree_api_key_nile"
  gasfree_api_secret_nile: "x402-facilitator/gasfree/gasfree_api_secret_nile"
  gasfree_api_key_mainnet: "x402-facilitator/gasfree/gasfree_api_key_mainnet"
  gasfree_api_secret_mainnet: "x402-facilitator/gasfree/gasfree_api_secret_mainnet"

server:
  host: "0.0.0.0"
  port: 8001

logging:
  # Matches the existing production bind mount:
  # /data/logs/facilitator-v2-logs:/app/logs (writable by uid/gid 1000).
  dir: "/app/logs"
  filename: "app.log"
  level: "INFO"

rate_limit:
  # Per-instance counters; remove any RATE_LIMIT_STORE=redis env override.
  store: memory
  api_key_refresh_interval: 60
  authenticated: "1000/minute"
  anonymous: "10/minute"

monitoring:
  port: 9001
  endpoint: "/metrics"

facilitator:
  networks:
    # TRON Nile testnet
    tron:3448148188:
      schemes: ["exact", "upto", "batch-settlement"]
    # TRON Mainnet
    tron:728126428:
      schemes: ["exact", "upto", "batch-settlement"]
    # BSC Testnet
    eip155:97:
      schemes: ["exact", "upto", "batch-settlement"]
    # BSC Mainnet
    eip155:56:
      schemes: ["exact", "upto", "batch-settlement"]
    # Base Sepolia testnet
    eip155:84532:
      schemes: ["exact", "upto", "batch-settlement"]
    # Base Mainnet
    eip155:8453:
      schemes: ["exact", "upto", "batch-settlement"]

# This block enables Nile sponsorship only, NOT TRON Mainnet sponsorship.
# Owner and permission ID are operator-confirmed. Resource limits mirror dev;
# verify actual Owner stake and available capacity before release.
# Only Nile receives Approval resource sponsorship; all payment networks above
# and their GasFree configuration remain enabled independently.
# For multiple networks, use a list of complete entries here (see README).
# Replicas sharing an Owner must use identical permissions and limits.
resource_sponsoring:
  network: "tron:3448148188"
  require_api_key: true
  storage:
    type: postgres

  # Use a Nile Owner dedicated to this PG ledger; never reuse an Owner with
  # outstanding obligations in another database. Keep its master key off-server.
  owner: "THuJK6PNaXibaQhxUdqUXczU57Y8EKhpex"
  wallet_id: "resource-active"
  # Uses AGENT_WALLET_DIR; keep settlement as the active/default wallet.
  # Owner, resource-active signer and settlement must be distinct addresses.
  # Match the actual on-chain Active permission (delegate/undelegate only).
  permission_id: 3

  # Nile USDT. Sponsoring does not restrict payment recipients.
  assets: ["TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf"]

  # Review limits against actual stake and concurrency before deployment.
  # These do not automatically stake funds. 1 TRX = 1,000,000 SUN.
  energy_stake_sun: "10000000000"
  bandwidth_stake_sun: "20000000000"
  budget_sun: "500000000"
  # Bandwidth units reserved for resource management transactions.
  management_bandwidth: "5000"
