# x402 Facilitator v2 config (TypeScript / upstream @x402/* ecosystem)

server:
  host: "0.0.0.0"
  port: 8001

logging:
  level: "info"

database:
  url: ""
  # ssl_mode: "disable"        # disable | require | verify-ca | verify-full
  # max_open_conns: 25
  # max_idle_conns: 15
  # max_life_time: 600

# 1Password: each value is "vault/item/field". Set OP_SERVICE_ACCOUNT_TOKEN when using.
onepassword:
  database_password: ""
  trongrid_api_key: ""
  agent_wallet_password: ""
  gasfree_api_key_nile: ""
  gasfree_api_secret_nile: ""
  gasfree_api_key_mainnet: ""
  gasfree_api_secret_mainnet: ""

rate_limit:
  api_key_refresh_interval: 60
  authenticated: "1000/minute"
  anonymous: "10/minute"

monitoring:
  port: 9001
  endpoint: "/metrics"

facilitator:
  trongrid_api_key: ""

  # Per-network config. Key = CAIP network id; listed = enabled.
  # base_fee is a TRON-only facilitator fee, advertised via the scheme's
  # getExtra().feeConfig (attached to PaymentRequirements.extra.fee). The EVM exact
  # scheme takes no facilitator fee (settles the exact amount), so EVM networks have
  # no base_fee. There is no /fee/quote endpoint in v2.
  networks:
    tron:nile:
      base_fee:
        USDT: 100              # 0.0001 USDT (6 decimals)
        USDD: 100000000000000  # 0.0001 USDD (18 decimals)
    bsc:testnet: {}
    # Enable after mainnet Permit2 / x402ExactPermit2Proxy contracts are deployed
    # and addresses are filled into @x402/tron constants.
    # tron:mainnet:
    #   base_fee:
    #     USDT: 100
    # bsc:mainnet: {}
