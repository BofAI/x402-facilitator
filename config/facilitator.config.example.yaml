# x402 Facilitator v2 config (TypeScript / upstream @x402/* ecosystem)

server:
  host: "0.0.0.0"
  port: 8001

logging:
  level: "info"
  # File logging. Both dir + filename set => append logs to a file (fixed name,
  # not timestamped) in addition to console. Matches legacy defaults; comment out
  # to disable file logging.
  dir: "logs"
  filename: "x402-facilitator.log"

database:
  url: ""
  # ssl_mode: "disable"        # disable | require | verify-ca | verify-full
  # max_open_conns: 25
  # max_idle_conns: 15
  # max_life_time: 600

# 1Password: each value is "vault/item/field". Set OP_SERVICE_ACCOUNT_TOKEN when using.
onepassword:
  database_password: ""
  trongrid_api_key: ""
  agent_wallet_password: ""
  gasfree_api_key_nile: ""
  gasfree_api_secret_nile: ""
  gasfree_api_key_mainnet: ""
  gasfree_api_secret_mainnet: ""

rate_limit:
  api_key_refresh_interval: 60
  authenticated: "1000/minute"
  anonymous: "10/minute"

monitoring:
  port: 9001
  endpoint: "/metrics"

facilitator:
  trongrid_api_key: ""

  # Per-network config. Key = canonical CAIP-2 network id; listed = enabled.
  #
  # schemes: which payment schemes to register for the network. Defaults to
  # all schemes (exact, upto, batch-settlement) when omitted. Options: exact |
  # upto | batch-settlement. On TRON,
  # exact also registers exact_gasfree when GasFree creds resolve. batch-settlement
  # uses the facilitator's agent-wallet as the receiverAuthorizer (published via
  # /supported); in production this may be a separate key.
  networks:
    # TRON Nile testnet
    tron:0xcd8690dc:
      schemes: ["exact", "upto", "batch-settlement"]
    # TRON Shasta testnet
    tron:0x94a9059e:
      schemes: ["exact", "upto", "batch-settlement"]
    # TRON Mainnet
    tron:0x2b6653dc:
      schemes: ["exact", "upto", "batch-settlement"]
    # BSC Testnet
    eip155:97:
      schemes: ["exact", "upto", "batch-settlement"]
    # BSC Mainnet
    eip155:56:
      schemes: ["exact", "upto", "batch-settlement"]
    # Base Sepolia testnet
    eip155:84532:
      schemes: ["exact", "upto", "batch-settlement"]
    # Base Mainnet
    eip155:8453:
      schemes: ["exact", "upto", "batch-settlement"]
